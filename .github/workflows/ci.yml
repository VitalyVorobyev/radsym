name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --exclude radsym-wasm -- -D warnings
      # schemas/*.json are generated from the config types; fail on drift.
      - name: Check generated config schemas are up to date
        run: cargo run -p xtask -- emit-schemas --check

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: all-features
            flags: --all-features
          - name: no-default-features
            flags: --no-default-features
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true # testdata/*.png is Git LFS-backed; perf_export_ringgrid decodes it
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude radsym-wasm ${{ matrix.flags }}

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --exclude radsym-wasm

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --exclude radsym-wasm --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  wasm-build:
    name: WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p radsym-wasm --target wasm32-unknown-unknown
      # Native tests for the JSON config helpers (no JsValue involved).
      - run: cargo test -p radsym-wasm --lib
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM package
        run: wasm-pack build crates/radsym-wasm --target web --release
      # Same packaging as release-npm.yml: the JSON Schemas must ride along in
      # the npm tarball.
      - name: Bundle JSON Schemas into the package
        run: scripts/bundle-npm-schemas.sh
      - name: Assert the npm tarball contains the schemas
        run: scripts/check-npm-pack.sh
